{% extends "base.html" %}
{% block title %}Verify a file - ModelLedger{% endblock %}

{% block content %}
<section class="page narrow">
  <h1 class="h-sm">Verify a file</h1>
  <p class="lede">Upload any copy, including one that was compressed or forwarded. ModelLedger looks for a registered identifier.</p>

  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}

  <form class="form" method="post" action="/verify" enctype="multipart/form-data" data-busy="Verifying…">
    <div class="drop" data-max-mb="{{ max_mb|default(25) }}">
      <input type="file" id="file" name="file" required
             accept="image/*,audio/*,video/*,application/pdf" aria-describedby="file-msg">
      <label for="file" class="drop-face">
        <strong>Choose a file or drop it here</strong>
        <span>Image, audio, video or PDF, up to {{ max_mb|default(25) }} MB</span>
      </label>
      <p class="drop-msg" id="file-msg" aria-live="polite"></p>
      <input type="hidden" name="media_kind" value="">
    </div>

    <button class="btn primary" type="submit">Verify file</button>
  </form>
</section>
{% endblock %}
