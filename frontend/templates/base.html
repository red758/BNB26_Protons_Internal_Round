<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ModelLedger{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="bar">
    <a class="mark" href="/">ModelLedger</a>
    <nav aria-label="Main">
      <a href="/register" {% if request.path == '/register' %}aria-current="page"{% endif %}>Register</a>
      <a href="/verify" {% if request.path == '/verify' %}aria-current="page"{% endif %}>Verify</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    A watermark is a pointer. The provenance lives in the registration record.
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
